image: node:22.23.4

stages:
  - quality
  - build

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: "0"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci

code_check:
  stage: quality
  script:
    - npm run check

unit_tests:
  stage: quality
  script:
    - npm test

dependency_audit:
  stage: quality
  script:
    - npm audit --audit-level=high

production_build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
secret_detection:
  stage: quality
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks git . --no-banner
